commands:
  rtp:
    cooldown-seconds: 30
    max-tries: 10
    radius:
      min: 2000
      max: 10000
    unsafe-blocks-regex:
      - LAVA
      - WATER
      - .*_LEAVES
      - (TALL_)?SEAGRASS
  tpa:
    request-lifetime-seconds: 60

tab:
  enabled: true
  update-ticks:
    header: -1
    footer: 20
    player-names: 400

auto-messages:
  enabled: true
  interval-seconds: 120

# В формате %1$s - ник игрока (displayName), а %2$s - сообщение игрока
chat:
  enabled: true
  format: "%luckperms_prefix% %1$s &8➵ &f%luckperms_suffix%%2$s" # PAPI Expansions "LuckPerms"
  local-chat-radius: 100
  prefixes:
    global-chat: "&8[&cG&8]&9"
    local-chat: "&8[&aL&8]&9"
  cooldown-seconds: 3
  no-recipients-sound: ENTITY_ENDERMAN_TELEPORT
